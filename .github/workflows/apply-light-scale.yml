name: Apply light and scale tweak

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-light-scale.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply framing and lighting tweak
        run: python tools/patch_stage_light_scale.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Test
        working-directory: web
        run: npm test
      - name: Syntax check
        run: node --check web/src/main.js
      - name: Build and package demo
        working-directory: web
        run: npm run release
      - name: Verify tweak
        run: |
          grep -q "\* 1.12" web/src/main.js
          grep -q "software ? .85 : 2.30" web/src/main.js
          grep -q "software ? .25 : .84" web/src/main.js
      - name: Remove one-shot helpers
        run: |
          rm -f .github/workflows/apply-light-scale.yml
          rm -f tools/patch_stage_light_scale.py
      - name: Commit tweak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Brighten WBC lighting and tighten robot framing"
          git push origin HEAD:main
