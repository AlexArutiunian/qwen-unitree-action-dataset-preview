name: Validate manual pose controls

on:
  push:
    branches:
      - feature/manual-pose-controls-final
    paths:
      - '.github/workflows/validate-manual-pose.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply patch
        run: python3 tools/apply_manual_pose_patch.py
      - name: Install
        working-directory: web
        run: npm ci
      - name: Tests
        working-directory: web
        run: npm test
      - name: Syntax checks
        run: |
          node --check web/src/main.js
          node --check web/src/engine.worker.js
      - name: Production release
        working-directory: web
        run: npm run release
      - name: Verify packaged demo
        shell: bash
        run: |
          grep -q "Number(action.sample_id) === id" web/src/main.js
          grep -q "type: 'manualPose'" web/src/main.js
          grep -q "MANUAL_JOINTS" web/src/engine.worker.js
          grep -q "manualPoseControls" web/index.html
          grep -q "manualPoseControls" demo/index.html
          test -n "$(find demo/assets -name '*.js' -print -quit)"
          test -n "$(find demo/assets -name '*.css' -print -quit)"
      - name: Remove temporary helpers
        run: |
          rm -f tools/apply_manual_pose_patch.py
          rm -f .github/workflows/validate-manual-pose.yml
      - name: Commit validated feature
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix ID search and add manual pose sliders'
          git push origin HEAD:feature/manual-pose-controls-final
