name: Make action prompt compact above viewer

on:
  push:
    paths:
      - '.github/workflows/compact-suggestion-prompt.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Compact prompt bar
        run: python3 tools/compact_prompt_patch.py
      - name: Install
        working-directory: web
        run: npm ci
      - name: Test
        working-directory: web
        run: npm test
      - name: Build and package demo
        working-directory: web
        run: npm run release
      - name: Verify compact prompt
        shell: bash
        run: |
          grep -q 'Compact contribution bar v2' web/src/style.css
          test -n "$(find demo/assets -name '*.css' -print -quit)"
          grep -q 'Что должен сделать робот?' demo/index.html
      - name: Remove one-shot files
        run: rm -f .github/workflows/compact-suggestion-prompt.yml tools/compact_prompt_patch.py
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make action prompt compact above viewer'
          git push origin HEAD:main
