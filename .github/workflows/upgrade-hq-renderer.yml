name: Upgrade exact G1 renderer

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/upgrade-hq-renderer.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout pinned official Unitree model
        uses: actions/checkout@v4
        with:
          repository: unitreerobotics/unitree_mujoco
          ref: 1eb6642e3f3fdfb7fb13a9794fd6a2dd93ea0e7d
          path: _unitree_source

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install model builder
        run: pip install -r tools/requirements-web-model.txt

      - name: Apply HQ renderer source migration
        run: python tools/apply_hq_renderer.py

      - name: Build exact official visual meshes
        run: python tools/build_web_model.py _unitree_source --output web/public/model --faces-per-mesh 0

      - name: Verify exact geometry
        run: python -c "import json; m=json.load(open('web/public/model/manifest.json')); assert m['exact_visual_meshes'] is True; assert m['web_faces']==m['original_faces']; assert m['original_faces']>=370000; print('Exact official faces:', m['web_faces'])"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        run: npm test

      - name: Build and package demo
        working-directory: web
        run: npm run release

      - name: Remove one-shot migration helpers
        run: |
          rm -f .github/workflows/upgrade-hq-renderer.yml
          rm -f tools/apply_hq_renderer.py
          rm -rf _unitree_source

      - name: Commit exact renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Render official full-resolution G1 geometry"
          git push origin HEAD:main
