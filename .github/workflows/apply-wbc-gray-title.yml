name: Apply WBC gray renderer and title layout

on:
  push:
    branches:
      - render-wbc-gray-title
    paths:
      - '.github/workflows/apply-wbc-gray-title.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: render-wbc-gray-title
      - name: Apply WBC visual patch
        run: python tools/patch_wbc_gray_title.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Test
        working-directory: web
        run: npm test
      - name: Syntax check
        run: node --check web/src/main.js
      - name: Build
        working-directory: web
        run: npm run build
      - name: Verify WBC renderer and title band
        run: |
          grep -q "THREE.NoToneMapping" web/src/main.js
          grep -q "WBC gray" web/src/main.js
          grep -q "headlight = new THREE.DirectionalLight" web/src/main.js
          grep -q "inset:132px 0 98px" web/src/style.css
          grep -q "height:132px" web/src/style.css
      - name: Remove one-shot helpers
        run: |
          rm -f .github/workflows/apply-wbc-gray-title.yml
          rm -f tools/patch_wbc_gray_title.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Match WBC gray rendering and separate title from viewport"
          git push origin HEAD:render-wbc-gray-title
