name: Apply prominent action prompt and stage navigation

on:
  push:
    paths:
      - '.github/workflows/apply-mobile-action-ux.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply UX changes
        run: python3 .github/scripts/apply_mobile_action_ux.py
      - name: Install
        working-directory: web
        run: npm ci
      - name: Test
        working-directory: web
        run: npm test
      - name: Syntax check
        run: node --check web/src/main.js
      - name: Build and package demo
        working-directory: web
        run: npm run release
      - name: Verify packaged UX
        shell: bash
        run: |
          grep -q 'stagePrevAction' web/index.html
          grep -q 'stageNextAction' web/index.html
          grep -q 'suggestion-box suggestion-hero' web/index.html
          grep -q 'stage-actions' web/src/style.css
          grep -R -q 'stagePrevAction' demo/assets
          grep -q 'ПРЕДЛОЖИТЬ ACTION' demo/index.html
      - name: Remove one-shot files
        run: |
          rm -f .github/workflows/apply-mobile-action-ux.yml
          rm -f .github/scripts/apply_mobile_action_ux.py
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Promote action prompt and add stage navigation'
          git push origin HEAD:main
