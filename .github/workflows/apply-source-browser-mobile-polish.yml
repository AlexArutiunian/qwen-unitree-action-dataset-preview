name: Apply source-id browser and mobile polish

on:
  push:
    paths:
      - '.github/workflows/apply-source-browser-mobile-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply changes
        run: python3 tools/refine_source_browser_patch.py
      - name: Install
        working-directory: web
        run: npm ci
      - name: Test
        working-directory: web
        run: npm test
      - name: Syntax check
        run: node --check web/src/main.js
      - name: Release demo
        working-directory: web
        run: npm run release
      - name: Verify
        shell: bash
        run: |
          grep -q 'function sourceRepresentatives' web/src/main.js
          grep -q "browseSource(-1)" web/src/main.js
          grep -q 'Source-id browsing + compact prompt polish v3' web/src/style.css
          grep -q '>Отправить</button>' web/index.html
          grep -q 'Что должен сделать робот?' demo/index.html
          grep -R -q 'sourceRepresentatives' demo/assets
      - name: Remove one-shot files
        run: |
          rm -f .github/workflows/apply-source-browser-mobile-polish.yml
          rm -f tools/refine_source_browser_patch.py
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Browse unique source actions and polish mobile prompt'
          git push origin HEAD:main
