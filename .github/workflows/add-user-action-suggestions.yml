name: Add user action suggestion collection

on:
  push:
    paths:
      - '.github/workflows/add-user-action-suggestions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply suggestion collector patch
        run: python3 .github/scripts/add_suggestions.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        run: npm test

      - name: Syntax check
        run: |
          node --check web/src/main.js
          node --check web/src/submission-config.js

      - name: Build demo
        working-directory: web
        run: npm run build

      - name: Verify suggestion collector assets
        run: |
          grep -q 'ПРЕДЛОЖИТЬ ACTION' web/index.html
          grep -q 'submitSuggestion' web/src/main.js
          grep -q 'SPREADSHEET_ID' tools/google_apps_script/Code.gs
          grep -q 'suggestion-box' web/src/style.css

      - name: Remove one-shot helpers
        run: rm -f .github/workflows/add-user-action-suggestions.yml .github/scripts/add_suggestions.py

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add user action suggestion form and Google Sheets collector'
          git push origin HEAD:main
