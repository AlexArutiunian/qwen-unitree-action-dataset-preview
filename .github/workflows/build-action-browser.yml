name: Build action browser demo

on:
  push:
    branches:
      - feature/action-browser-1626
    paths:
      - 'web/**'
      - 'tools/package_demo.mjs'
      - '.github/workflows/build-action-browser.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/action-browser-1626
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Test
        working-directory: web
        run: npm test
      - name: Build and package demo
        working-directory: web
        run: npm run release
      - name: Commit generated demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo
          if git diff --cached --quiet; then
            echo "demo/ already up to date"
            exit 0
          fi
          git commit -m "Build 1626-action demo [skip ci]"
          git push origin HEAD:feature/action-browser-1626
