name: Apply camera angle and mobile viewer layout

on:
  push:
    paths:
      - '.github/workflows/apply-camera-mobile-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply camera and layout changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          js = Path('web/src/main.js')
          s = js.read_text()
          replacements = {
              "  if (view === 'front') direction.set(1, 0, 0.08);": "  if (view === 'front') direction.set(1, 0, 0.22);",
              "  if (view === 'side') direction.set(0, -1, 0.08);": "  if (view === 'side') direction.set(0, -1, 0.16);",
              "  if (view === 'back') direction.set(-1, 0, 0.08);": "  if (view === 'back') direction.set(-1, 0, 0.22);",
              "  const framing = camera.aspect < 0.82 ? 1.10 : 1.03;": "  const framing = camera.aspect < 0.82 ? 1.03 : 1.00;",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected JS text: {old}')
              s = s.replace(old, new, 1)
          js.write_text(s)

          css = Path('web/src/style.css')
          c = css.read_text()
          css_replacements = {
              "#viewport{position:absolute;inset:132px 0 98px;touch-action:none}": "#viewport{position:absolute;inset:132px 0 152px;touch-action:none}",
              ".camera{position:absolute;bottom:139px;left:24px;display:flex;gap:6px}": ".camera{position:absolute;bottom:98px;left:0;right:0;height:54px;display:grid;grid-template-columns:repeat(4,minmax(96px,140px));justify-content:start;align-items:center;gap:8px;padding:7px 24px;background:#151e2bf2;border-top:1px solid #344257;border-bottom:1px solid #344257;z-index:2}",
              ".camera button{font-size:14px;background:#18222fcc}": ".camera button{font-size:14px;background:#18222fcc;min-height:40px}",
              ".hint{position:absolute;bottom:113px;left:24px;font-size:12px;color:#a2b2c5;pointer-events:none}": ".hint{position:absolute;bottom:116px;right:24px;left:auto;font-size:12px;color:#a2b2c5;pointer-events:none;z-index:3}",
              "#viewport{top:108px;bottom:108px}.camera{bottom:140px;left:10px;right:10px;gap:5px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}": "#viewport{top:108px;bottom:166px}.camera{bottom:108px;left:0;right:0;height:58px;gap:5px;padding:8px 10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));justify-content:stretch}",
          }
          for old, new in css_replacements.items():
              if old not in c:
                  raise SystemExit(f'missing expected CSS text: {old}')
              c = c.replace(old, new, 1)
          # Hide the mouse hint before it can collide with the camera bar on tablet widths.
          c = c.replace("@media(max-width:1100px){main{", "@media(max-width:1100px){.hint{display:none}main{", 1)
          css.write_text(c)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        run: npm test

      - name: Syntax check
        run: node --check web/src/main.js

      - name: Build and package demo
        working-directory: web
        run: npm run build

      - name: Verify camera and mobile layout
        shell: bash
        run: |
          grep -q "direction.set(1, 0, 0.22)" web/src/main.js
          grep -q "camera.aspect < 0.82 ? 1.03 : 1.00" web/src/main.js
          grep -q "bottom:166px" web/src/style.css
          grep -q "bottom:108px" web/src/style.css

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/apply-camera-mobile-layout.yml

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Move camera controls below viewport and adjust default camera'
          git push origin HEAD:main
