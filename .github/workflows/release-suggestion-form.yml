name: Release suggestion form to demo

on:
  push:
    paths:
      - '.github/workflows/release-suggestion-form.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Test
        working-directory: web
        run: npm test
      - name: Package demo
        working-directory: web
        run: npm run release
      - name: Verify packaged form
        run: |
          grep -q 'ПРЕДЛОЖИТЬ ACTION' demo/index.html
          grep -R -q 'Сбор команд готов' demo/assets
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/release-suggestion-form.yml
      - name: Commit packaged demo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release user action suggestion form to demo'
          git push origin HEAD:main
