name: Release and test suggestion endpoint

on:
  push:
    paths:
      - '.github/workflows/release-and-test-suggestion-endpoint.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Test
        working-directory: web
        run: npm test
      - name: Release demo
        working-directory: web
        run: npm run release
      - name: Verify endpoint is packaged
        run: grep -R -q 'AKfycbwGmnY_ZoXLKCZlihSj2f3AFTSn7GtYMTSMDgpR7UnaYcZi7lkzEa5QhzxdGkTI9bBr' demo/assets
      - name: Smoke test Apps Script endpoint
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://script.google.com/macros/s/AKfycbwGmnY_ZoXLKCZlihSj2f3AFTSn7GtYMTSMDgpR7UnaYcZi7lkzEa5QhzxdGkTI9bBr/exec'
          curl -fsSL "$ENDPOINT" | tee /tmp/g1-endpoint-get.txt
          grep -q 'G1 suggestion collector is running' /tmp/g1-endpoint-get.txt
          curl -fsSL -X POST "$ENDPOINT" \
            --data-urlencode 'command=TEST ChatGPT endpoint connection - ignore for training' \
            --data-urlencode 'current_action_id=91' \
            --data-urlencode 'current_action_class=basic_pose_control' \
            --data-urlencode 'current_action_augmentation=endpoint_test' \
            --data-urlencode 'page_url=https://alexarutiunian.github.io/qwen-unitree-action-dataset-preview/demo/' \
            --data-urlencode 'submission_id=chatgpt-endpoint-smoke-test-2026-09-08' \
            --data-urlencode 'website=' \
            | tee /tmp/g1-endpoint-post.txt
          grep -q '"ok":true' /tmp/g1-endpoint-post.txt
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/release-and-test-suggestion-endpoint.yml
      - name: Commit packaged demo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release connected user action collector'
          git push origin HEAD:main
