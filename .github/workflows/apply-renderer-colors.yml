name: Apply renderer color correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-renderer-colors.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply color correction
        run: python tools/patch_renderer_colors.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Test
        working-directory: web
        run: npm test
      - name: Build and package demo
        working-directory: web
        run: npm run release
      - name: Verify color pipeline
        run: |
          grep -q "THREE.SRGBColorSpace" web/src/main.js
          grep -q "toneMappingExposure = .86" web/src/main.js
          grep -q "envMapIntensity: .45" web/src/main.js
      - name: Remove one-shot helpers
        run: |
          rm -f .github/workflows/apply-renderer-colors.yml
          rm -f tools/patch_renderer_colors.py
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct G1 material colors and exposure"
          git push origin HEAD:main
