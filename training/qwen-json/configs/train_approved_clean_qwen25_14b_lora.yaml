project_root: .
run_name: approved_clean_qwen25_14b_lora
output_dir: outputs/approved_clean_qwen25_14b_lora
model_name: Qwen/Qwen2.5-14B-Instruct
prompt_mode: compact
max_seq_length: 8192
max_new_tokens: 768
seed: 42
cuda_visible_devices: "0"
bnb_4bit_compute_dtype: float16

dataset:
  local_sft_dir: outputs/dataset_approved_clean_sft
  work_dir: outputs/dataset_approved_clean_sft

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  max_steps: 600
  num_train_epochs: 50
  batch_size: 1
  eval_batch_size: 1
  grad_accum: 8
  learning_rate: 0.00008
  lr_scheduler_type: cosine
  warmup_ratio: 0.06
  logging_steps: 1
  eval_steps: 25
  save_steps: 25
  save_total_limit: 5
  early_stopping_patience: 10
  early_stopping_threshold: 0.0005
  optim: paged_adamw_8bit
  report_to: ["tensorboard"]
  dataloader_num_workers: 0
  plot_after_train: true
